  <g fill="#252b2d" font-family="sans-serif" font-size="15">
    <text x="126" y="102">北墙 Y=42</text><text x="360" y="116">JF-02 北门</text>
    <text x="348" y="203">JF-04 北引道</text><text x="217" y="348" text-anchor="end">JF-01 台基／塔心</text>
    <text x="108" y="559">JF-03 院墙</text><text x="462" y="490">JF-05 附屋（可选）</text>
    <text x="392" y="300" font-size="13">JF-06 副阶占位（可选）</text>
