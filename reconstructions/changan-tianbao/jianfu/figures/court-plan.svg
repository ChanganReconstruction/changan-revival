<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
  <title id="title">JF-F02 浮图院采用总平面</title>
  <desc id="desc">仅用于量取展示方案，每米6图面单位。方案院墙外皮东西72米、南北78米；北门与塔同轴为布置选择。虚线另示可选的塔副阶（参考1116年碑文转引，形制为假设）与两座无名配屋。</desc>
  <rect width="720" height="660" fill="#f8f6f0"/>
  <g fill="#252b2d" font-family="sans-serif">
    <text x="24" y="36" font-size="22">JF-F02｜浮图院采用总平面</text>
    <text x="24" y="60" font-size="14">项目坐标，非历史地籍；平面几何可按比例尺量取。</text>
  </g>
  <!-- Project metres: X east, Y north, origin at tower centre. -->
