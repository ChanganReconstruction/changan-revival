<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <style>
    .bg { fill: #fbfaf6; }
    .ward { fill: #f4f0e6; stroke: #4a4238; stroke-width: 4; }
    .street { fill: #e6dfd0; stroke: #b8ac97; stroke-width: 1.5; }
    .gate { fill: #fffdf8; stroke: #6b5f4f; stroke-width: 2; }
    .quad { fill: none; stroke: #b9ae9b; stroke-width: 1; stroke-dasharray: 7 6; }
    .title { font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif; font-size: 30px; font-weight: 700; fill: #2f2a24; }
    .sub { font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif; font-size: 16px; fill: #675c4c; }
    .h { font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif; font-size: 21px; font-weight: 700; fill: #3b3329; }
    .t { font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif; font-size: 15px; fill: #3d352b; }
    .s { font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif; font-size: 13px; fill: #6c604f; }
    .x { font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif; font-size: 12px; fill: #7c705e; }
    .box { fill: #fffdf7; stroke: #b9ae9b; stroke-width: 1.2; }
    .note { font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif; font-size: 13px; fill: #5d5346; }
  </style>

  <rect class="bg" x="0" y="0" width="1500" height="960"/>

  <text class="title" x="60" y="64">平康坊全坊对象分布示意</text>
  <text class="sub" x="60" y="94">按文献方位分组，不是测绘平面；矩形与四隅不等于实际比例，所有对象均未按坐标定位。</text>

  <!-- ward -->
  <rect class="ward" x="90" y="150" width="900" height="560"/>
  <!-- cross streets -->
  <rect class="street" x="531" y="150" width="18" height="560"/>
  <rect class="street" x="90" y="421" width="900" height="18"/>

  <!-- quadrant dashed boxes -->
  <rect class="quad" x="108" y="168" width="405" height="235"/>
  <rect class="quad" x="108" y="457" width="405" height="235"/>
  <rect class="quad" x="567" y="168" width="405" height="235"/>
  <rect class="quad" x="567" y="457" width="405" height="235"/>

  <!-- gates -->
  <rect class="gate" x="516" y="132" width="48" height="26"/>
  <text class="s" x="540" y="150" text-anchor="middle">北门</text>
  <rect class="gate" x="516" y="702" width="48" height="26"/>
  <text class="s" x="540" y="720" text-anchor="middle">南门</text>
  <rect class="gate" x="72" y="406" width="26" height="48"/>
  <text class="s" x="58" y="436" text-anchor="middle">西</text>
  <rect class="gate" x="982" y="406" width="26" height="48"/>
  <text class="s" x="1004" y="436" text-anchor="middle">东</text>

  <!-- NW -->
  <text class="h" x="128" y="200">西北隅</text>
  <text class="t" x="128" y="232">隋 · 李穆宅</text>
  <text class="s" x="128" y="258">太师、申国公</text>
  <text class="t" x="128" y="292">景龙：王府＋鞠场</text>
  <text class="s" x="128" y="318">景云：废，球场散卖与居人</text>
  <text class="x" x="128" y="348">只记沿革，无球场尺寸与宅界</text>

  <!-- SW -->
  <text class="h" x="128" y="492">西南隅</text>
  <text class="t" x="128" y="524">韦澄宅 · 兰陵长公主宅</text>
  <text class="t" x="128" y="556">万安观（天宝七载 748）</text>
  <text class="s" x="128" y="582">本姚崇宅；次东太平公主宅</text>
  <text class="s" x="128" y="606">后赐郭虔瓘，最终并为观</text>
  <text class="x" x="128" y="636">观内公主影堂，李昭道画山水</text>

  <!-- SE -->
  <text class="h" x="587" y="492">东南隅</text>
  <text class="t" x="587" y="524">李林甫宅（本李靖宅）</text>
  <text class="s" x="587" y="550">正堂之后有月堂，号“偃月／却月”</text>
  <text class="t" x="587" y="584">嘉猷观</text>
  <text class="s" x="587" y="610">分宅东南隅而立；精思院有壁画</text>
  <text class="x" x="587" y="640">观界、宅界、月堂平面均未知</text>

  <!-- NE -->
  <text class="h" x="587" y="200">东北隅</text>
  <text class="t" x="587" y="232">无明确建筑记载</text>
  <text class="s" x="587" y="258">1957 年鎏金银茶托出土地</text>
  <text class="x" x="587" y="288">出土地不等于宅院位置，不补平面</text>

  <!-- central / edge objects -->
  <text class="t" x="548" y="392" text-anchor="middle">阳化寺</text>
  <text class="x" x="548" y="412" text-anchor="middle">十字街之北，具体地块未定</text>

  <rect class="box" x="596" y="646" width="180" height="42"/>
  <text class="t" x="686" y="664" text-anchor="middle">菩提寺（南门东）</text>
  <text class="x" x="686" y="681" text-anchor="middle">隋开皇二年立；钟楼在西</text>

  <rect class="box" x="332" y="646" width="190" height="42"/>
  <text class="t" x="427" y="664" text-anchor="middle">王志愔宅（南门西）</text>
  <text class="x" x="427" y="681" text-anchor="middle">崔泰之宅在其次北</text>

  <rect class="box" x="112" y="586" width="190" height="42"/>
  <text class="t" x="207" y="604" text-anchor="middle">褚遂良宅（西门南）</text>
  <text class="x" x="207" y="621" text-anchor="middle">其父褚亮先居于此</text>

  <!-- right panel -->
  <text class="h" x="1040" y="180">中晚唐 · 进奏院名称</text>
  <text class="s" x="1040" y="208">大历十二年（777）由留后院改称</text>
  <text class="t" x="1040" y="240">同华 · 可中 · 河阳 · 襄 · 徐 · 魏</text>
  <text class="t" x="1040" y="266">泾原 · 灵武 · 夏州 · 昭义</text>
  <text class="t" x="1040" y="292">浙西东 · 容州</text>
  <text class="x" x="1040" y="320">底本“可中”“浙西东”疑有脱误</text>
  <text class="x" x="1040" y="342">各院在坊内位置未逐条记载</text>

  <line x1="1040" y1="368" x2="1430" y2="368" stroke="#c9bfae" stroke-width="1"/>

  <text class="h" x="1040" y="404">晚唐 · 北里三曲</text>
  <text class="t" x="1040" y="434">北曲：循坊墙，卑屑妓所居</text>
  <text class="t" x="1040" y="460">中曲、南曲：门前通十字街</text>
  <text class="s" x="1040" y="486">院内有堂宇、厅事、花卉、怪石盆池</text>
  <text class="x" x="1040" y="510">入北门东回；晚唐，不并入天宝层</text>

  <line x1="1040" y1="536" x2="1430" y2="536" stroke="#c9bfae" stroke-width="1"/>

  <text class="h" x="1040" y="572">方位未记的宅第</text>
  <text class="t" x="1040" y="602">孔颖达 · 裴光庭 · 臧怀亮</text>
  <text class="t" x="1040" y="628">张弘靖 · 王哲 · 王俌</text>
  <text class="t" x="1040" y="654">霍国夫人王氏 · 陈苌 · 赵虔章</text>
  <text class="t" x="1040" y="680">马震 · 邢凤</text>
  <text class="x" x="1040" y="708">只能证“某人与此坊有关”，不能定宅界</text>

  <line x1="1040" y1="734" x2="1430" y2="734" stroke="#c9bfae" stroke-width="1"/>

  <text class="h" x="1040" y="770">其他</text>
  <text class="t" x="1040" y="800">菩提寺旧藏：玳瑁鞭、七宝帐</text>
  <text class="t" x="1040" y="826">1957 年茶托：高4、口径17.4厘米</text>
  <text class="t" x="1040" y="852">商铺说：仅百科转述，未见原典</text>

  <!-- bottom note -->
  <text class="note" x="90" y="790">实线：坊墙、十字街、四门；虚线：四隅分区。四隅只表示文献方位，不是地块边界。</text>
  <text class="note" x="90" y="816">菩提寺、王志愔宅、褚遂良宅按“南门东／南门西／西门南”的文献关系放置，仍非实测点位。</text>
  <text class="note" x="90" y="842">“18 处宅第”是坊志所见宅主条目，不等于天宝九载同年名册；进奏院、三曲均属中晚唐。</text>
  <text class="note" x="90" y="868">图中没有画出全部背景院落；完整对象表见 README 第二节。</text>
</svg>
