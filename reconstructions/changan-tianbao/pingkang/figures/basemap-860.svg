<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<style>
    .bg { fill: #fbfaf6; }
    .wall { fill: #f7f3e9; stroke: #4a4238; stroke-width: 4; }
    .street { fill: #e4dccb; stroke: #b3a58f; stroke-width: 1; }
    .gate { fill: #fffdf8; stroke: #5f5344; stroke-width: 2; }
    .block { fill: #fffdf7; stroke: #6f6250; stroke-width: 1.6; }
    .zone { fill: #efe8d8; stroke: #a89a84; stroke-width: 1.4; stroke-dasharray: 9 6; }
    .ghost { fill: #f4efe4; stroke: #a89a84; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .inner { fill: none; stroke: #b9ab95; stroke-width: 1; stroke-dasharray: 5 4; }
    .lane { fill: none; stroke: #cfc5b4; stroke-width: 1; stroke-dasharray: 4 6; }
    .title { font-family: "Noto Serif CJK SC","Source Han Serif SC",serif; font-size: 28px; font-weight: 700; fill: #2f2a24; }
    .subtitle { font-family: "Noto Serif CJK SC","Source Han Serif SC",serif; font-size: 15px; fill: #675c4c; }
    .head { font-family: "Noto Serif CJK SC","Source Han Serif SC",serif; font-size: 19px; font-weight: 700; fill: #3b3329; }
    .label { font-family: "Noto Serif CJK SC","Source Han Serif SC",serif; font-size: 15px; font-weight: 600; fill: #332d25; }
    .small { font-family: "Noto Serif CJK SC","Source Han Serif SC",serif; font-size: 11.5px; fill: #6b5f4e; }
    .tiny { font-family: "Noto Serif CJK SC","Source Han Serif SC",serif; font-size: 10px; fill: #7a6d5b; }
    .side { font-family: "Noto Serif CJK SC","Source Han Serif SC",serif; font-size: 12.5px; fill: #4b4134; }
    .note { font-family: "Noto Serif CJK SC","Source Han Serif SC",serif; font-size: 12px; fill: #5d5346; }
</style>
<rect class="bg" x="0" y="0" width="1500" height="900"/>
<text class="title" x="60" y="52" text-anchor="start"><tspan x="60" dy="0">平康坊建模底图 · 晚唐层（参照 860 前后）</tspan></text>
<text class="subtitle" x="60" y="80" text-anchor="start"><tspan x="60" dy="0">图稿基准 1000×520 单位；不是实测。晚唐层只放中晚唐有记载的对象，不叠加天宝宅第。</tspan></text>
