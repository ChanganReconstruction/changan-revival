<text class="head" x="1225" y="158" text-anchor="start"><tspan x="1225" dy="0">读图</tspan></text>
<text class="side" x="1225" y="184" text-anchor="start"><tspan x="1225" dy="0">实线：文献关系较明确</tspan></text>
<text class="side" x="1225" y="204" text-anchor="start"><tspan x="1225" dy="0">虚线：旧宅/推测范围</tspan></text>
<text class="side" x="1225" y="224" text-anchor="start"><tspan x="1225" dy="0">浅色块：位置未详，分配假设</tspan></text>
<text class="head" x="1225" y="254" text-anchor="start"><tspan x="1225" dy="0">晚唐层对象</tspan></text>
<text class="side" x="1225" y="280" text-anchor="start"><tspan x="1225" dy="0">保唐寺（原菩提寺）</tspan></text>
<text class="side" x="1225" y="300" text-anchor="start"><tspan x="1225" dy="0">嘉猷观（道士观）</tspan></text>
<text class="side" x="1225" y="320" text-anchor="start"><tspan x="1225" dy="0">万安观、阳化寺</tspan></text>
<text class="side" x="1225" y="340" text-anchor="start"><tspan x="1225" dy="0">李林甫旧宅/废蛮院</tspan></text>
<text class="side" x="1225" y="360" text-anchor="start"><tspan x="1225" dy="0">北里三曲</tspan></text>
<text class="side" x="1225" y="380" text-anchor="start"><tspan x="1225" dy="0">进奏院 12 条名称</tspan></text>
<text class="head" x="1225" y="410" text-anchor="start"><tspan x="1225" dy="0">进奏院名单</tspan></text>
<text class="small" x="1225" y="436" text-anchor="start"><tspan x="1225" dy="0">1 同华  2 可中  3 河阳</tspan></text>
<text class="small" x="1225" y="453" text-anchor="start"><tspan x="1225" dy="0">4 襄  5 徐  6 魏</tspan></text>
<text class="small" x="1225" y="470" text-anchor="start"><tspan x="1225" dy="0">7 泾原  8 灵武  9 夏州</tspan></text>
<text class="small" x="1225" y="487" text-anchor="start"><tspan x="1225" dy="0">10 昭义  11 浙西东  12 容州</tspan></text>
<text class="small" x="1225" y="512" text-anchor="start"><tspan x="1225" dy="0">“可中”“浙西东”疑底本脱误</tspan></text>
<text class="small" x="1225" y="529" text-anchor="start"><tspan x="1225" dy="0">各院位置无逐条记载</tspan></text>
<text class="note" x="60" y="720" text-anchor="start"><tspan x="60" dy="0">晚唐层不是天宝层的叠加：三曲、进奏院属中晚唐，不能放回 750 年图。</tspan></text>
<text class="note" x="60" y="740" text-anchor="start"><tspan x="60" dy="0">三曲按“入北门，东回三曲”放在东北部，三条带的宽度、长度、院数均为假设。</tspan></text>
<text class="note" x="60" y="760" text-anchor="start"><tspan x="60" dy="0">进奏院 12 条名称只表示制度名录；图中 4×3 浅色块是分配假设，不代表各院真实方位。</tspan></text>
<text class="note" x="60" y="780" text-anchor="start"><tspan x="60" dy="0">茶托出土地在坊东北隅，只标出土地，不据此指定某宅或某院。</tspan></text>
