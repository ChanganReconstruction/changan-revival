<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" role="img" aria-labelledby="title desc">
  <title id="title">PK-F01 平康坊坊区关系示意</title>
  <desc id="desc">平康坊北为崇仁坊与春明门街，东邻东市，南为宣阳坊。菩提寺在南门之东，李林甫宅在寺东。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #26211e; font-size: 18px }
    .title { font-size: 24px; font-weight: bold }
    .note { font-size: 15px }
    .zone { fill: #f5eadd; stroke: #aa8b6e }
    .assumed { fill: none; stroke: #9a6d48; stroke-width: 2; stroke-dasharray: 8 5 }
    .recorded { fill: #e4f2fa; stroke: #326888; stroke-width: 2 }
  </style>
  <rect width="900" height="518" fill="#fff"/>
  <text x="28" y="38" class="title">PK-F01　平康坊坊区关系示意</text>
  <text x="28" y="65" class="note">天宝时期关系示意 · 不按比例 · 门位、街线和宅界不可量取</text>
