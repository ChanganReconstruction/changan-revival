<text class="head" x="1225" y="158" text-anchor="start"><tspan x="1225" dy="0">读图</tspan></text>
<text class="side" x="1225" y="184" text-anchor="start"><tspan x="1225" dy="0">实线：文献有门/街/隅关系</tspan></text>
<text class="side" x="1225" y="204" text-anchor="start"><tspan x="1225" dy="0">虚线：推测范围，不是宅界</tspan></text>
<text class="side" x="1225" y="224" text-anchor="start"><tspan x="1225" dy="0">浅色块：方位未记，仅分配假设</tspan></text>
<text class="head" x="1225" y="254" text-anchor="start"><tspan x="1225" dy="0">天宝层对象</tspan></text>
<text class="side" x="1225" y="280" text-anchor="start"><tspan x="1225" dy="0">寺观 4：菩提寺、阳化寺、</tspan></text>
<text class="side" x="1225" y="300" text-anchor="start"><tspan x="1225" dy="0">万安观、嘉猷观</tspan></text>
<text class="side" x="1225" y="320" text-anchor="start"><tspan x="1225" dy="0">宅第 18：7 处有方位，</tspan></text>
<text class="side" x="1225" y="340" text-anchor="start"><tspan x="1225" dy="0">1 处弱线索，10 处仅列名</tspan></text>
<text class="head" x="1225" y="370" text-anchor="start"><tspan x="1225" dy="0">未放入图</tspan></text>
<text class="side" x="1225" y="396" text-anchor="start"><tspan x="1225" dy="0">进奏院：中晚唐制度，另见</tspan></text>
<text class="side" x="1225" y="416" text-anchor="start"><tspan x="1225" dy="0">晚唐层；天宝时称留后院</tspan></text>
<text class="head" x="1225" y="446" text-anchor="start"><tspan x="1225" dy="0">注意</tspan></text>
<text class="small" x="1225" y="472" text-anchor="start"><tspan x="1225" dy="0">图中矩形大小、间距、朝向</tspan></text>
<text class="small" x="1225" y="489" text-anchor="start"><tspan x="1225" dy="0">均为作图假设，不能当</tspan></text>
<text class="small" x="1225" y="506" text-anchor="start"><tspan x="1225" dy="0">建筑尺寸或宅界。</tspan></text>
<text class="note" x="60" y="720" text-anchor="start"><tspan x="60" dy="0">图稿基准：1000×520 单位，只为排版；若采用 1022×500 米说，可近似 1 单位≈1 米，但这不是测绘比例。</tspan></text>
<text class="note" x="60" y="740" text-anchor="start"><tspan x="60" dy="0">菩提寺—李林甫宅—嘉猷观是关系最强的一组：寺在南门东，宅在寺东，观在宅东南隅。</tspan></text>
<text class="note" x="60" y="760" text-anchor="start"><tspan x="60" dy="0">西南隅的万安观由姚崇宅、太平公主宅、郭虔瓘宅合并；图中只表达西—东相对次序，不表达院界。</tspan></text>
<text class="note" x="60" y="780" text-anchor="start"><tspan x="60" dy="0">东北隅 10 处宅第只知“在平康坊”，图中浅色块是分配假设；建模时可整体替换为待定组团。</tspan></text>
