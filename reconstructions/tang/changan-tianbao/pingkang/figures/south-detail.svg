<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 306 695 342" role="img" aria-labelledby="title desc">
  <title id="title">PK-F04 坊南建筑与入口关系示意</title>
  <desc id="desc">由西向东为南门西侧无名院落、南北主街、菩提寺和李林甫宅。实线表示史料所支持的方位关系，虚线表示项目中的门位、街道及建筑轮廓。</desc>
  <style>
    text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#242c31; font-size:10px }
    .title { font-size:16px; font-weight:bold }
    .label { font-size:11px; font-weight:bold }
    .road { fill:#e0c4a7; stroke:#946947; stroke-width:.55; stroke-dasharray:3 2 }
    .parcel { fill:#fcf8ef; stroke:none }
    .wall { fill:none; stroke:#876b51; stroke-width:.85; stroke-dasharray:3 2 }
    .house { fill:#dbc8ae; stroke:#815e40; stroke-width:.65; stroke-dasharray:2 1.2 }
    .building { fill:#bfdae7; stroke:#39768d; stroke-width:.65; stroke-dasharray:2 1.2 }
    .route { fill:none; stroke:#91551f; stroke-width:1.05; stroke-dasharray:4 3 }
    .relation { fill:none; stroke:#326888; stroke-width:1.3 }
    .reference { fill:none; stroke:#637578; stroke-width:.85 }
  </style>
  <rect x="350" y="306" width="695" height="342" fill="#fff"/>
  <text x="366" y="329" class="title">PK-F04　坊南建筑与入口放大图</text>
  <text x="366" y="348">沿用全坊示意坐标 · 北向上 · 实线仅表达有据的方位关系</text>
  <path d="M1023 350v-21l-4 6m4-6 4 6" class="reference"/>
  <text x="1023" y="324" text-anchor="middle">北</text>

  <g id="roads" class="road">
    <rect x="596" y="358" width="10" height="232"/>
    <rect x="601" y="478" width="439" height="4"/>
    <rect x="728" y="470" width="4" height="10"/>
    <rect x="938" y="470" width="4" height="10"/>
    <rect x="537" y="517" width="59" height="4"/>
  </g>
  <g id="pk-02">
    <rect x="650" y="365" width="160" height="105" class="parcel"/>
    <path d="M728 470h-78V365h160v105h-78" class="wall"/>
    <text x="730" y="386" text-anchor="middle" class="label">PK-02　菩提寺</text>
    <rect id="bell-tower" x="675" y="416" width="5" height="5" class="building"/>
    <text x="678" y="436" text-anchor="middle">西钟楼</text>
    <rect id="buddha-hall" x="721.5" y="402" width="17" height="10" class="building"/>
    <text x="730" y="398" text-anchor="middle">大佛殿</text>
    <rect id="dining-hall" x="773" y="430" width="12" height="7" class="building"/>
    <text x="779" y="452" text-anchor="middle">食堂</text>
    <text x="730" y="463" text-anchor="middle">寺门暂设</text>
  </g>
  <g id="pk-01">
    <rect x="865" y="365" width="150" height="105" class="parcel"/>
    <path d="M938 470h-73V365h150v105h-73" class="wall"/>
    <text x="940" y="386" text-anchor="middle" class="label">PK-01　李林甫宅</text>
    <path id="moon-hall" d="M932 406l4-2h8l4 2v5h-16z" class="building"/>
    <text x="940" y="400" text-anchor="middle">月堂</text>
    <rect id="main-hall" x="934" y="425" width="12" height="8" class="building"/>
    <text x="940" y="446" text-anchor="middle">正堂</text>
    <path d="M954 426v-16l-3 4m3-4 3 4" class="relation"/>
    <rect x="899" y="431" width="7" height="22" class="house"/>
    <rect x="974" y="431" width="7" height="22" class="house"/>
    <text x="900" y="427" text-anchor="middle">侧房</text>
    <text x="986" y="427" text-anchor="middle">侧房</text>
    <rect id="pk-03" x="979" y="447" width="30" height="17" class="wall"/>
    <text x="994" y="459" text-anchor="middle">03*</text>
    <text x="940" y="463" text-anchor="middle">宅门暂设</text>
  </g>
  <g id="pk-08">
    <rect x="377" y="482" width="160" height="81" class="parcel"/>
    <path d="M537 517v-35H377v81h160v-42" class="wall"/>
    <text x="457" y="500" text-anchor="middle" class="label">PK-08　南门西侧无名院落</text>
    <rect x="426" y="524" width="22" height="11" class="house"/>
    <rect x="459" y="509" width="18" height="8" class="house"/>
    <rect x="459" y="543" width="18" height="8" class="house"/>
    <text x="421" y="533" text-anchor="end">堂屋</text>
    <text x="486" y="516">北侧房</text>
    <text x="486" y="550">南侧房</text>
    <text x="537" y="512" text-anchor="middle">入口</text>
  </g>
  <path d="M601 588V519h-64m64 0v-39h339m-210 0v-10m210 10v-10" class="route"/>
  <path d="M815 408h45l-5-3m5 3-5 3" class="relation"/>
  <text x="837" y="400" text-anchor="middle">寺东</text>
  <path d="M363 590h236m4 0h428" class="wall"/>
  <circle cx="601" cy="590" r="3" fill="#fff" class="relation"/>
  <text x="601" y="607" text-anchor="middle">南门</text>
  <text x="774" y="498" text-anchor="middle">假设连巷 · 不对应已知街线</text>
  <text x="612" y="552">RD-02</text>
  <path d="M968 602v8m0-4h50m0-4v8" class="reference"/>
  <text x="993" y="623" text-anchor="middle">50 米 · 示意图比例</text>
  <text x="366" y="625">虚线为假设轮廓与门位；03* 嘉猷观建置确年未核实。</text>
</svg>
