<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">JF-F01 浮图院文献关系</title>
  <desc id="desc">大荐福寺在北、浮图院在南，两门隔街相对；塔图标不表示院中位置。</desc>
  <rect width="640" height="360" fill="#f8f6f0"/>
  <g font-family="sans-serif" fill="#252b2d">
    <text x="24" y="33" font-size="20">JF-F01｜浮图院文献关系</text>
    <text x="30" y="66" font-size="15">↑ 北</text>
    <rect x="90" y="59" width="460" height="70" rx="8" fill="#e5edf0"/>
    <text x="115" y="101" font-size="18">开化坊 · 大荐福寺本部（不建）</text>
    <path d="M300 130V230" fill="none" stroke="#26556b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="321" y="149" font-size="15">寺门</text>
    <path d="M90 167H550M90 193H550" stroke="#9d9b95" stroke-dasharray="4 4"/>
    <text x="115" y="186" font-size="15">坊间街（不建）</text>
    <text x="320" y="220" font-size="15">浮图院门北开</text>
    <rect x="90" y="235" width="460" height="84" rx="8" fill="#e5edf0"/>
    <text x="115" y="265" font-size="18">安仁坊西北隅 · 浮图院</text>
    <text x="115" y="290" font-size="15">院内有塔；门塔同轴与约 39 米间距是本版设定。</text>
    <text x="115" y="307" font-size="13">其余建筑无本址清单：仅北宋碑提到塔外副阶。</text>
    <text x="24" y="337" font-size="14">依据：《唐两京城坊考》卷二 · 关系示意，不按比例</text>
  </g>
</svg>
